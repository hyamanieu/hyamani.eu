baseURL = 'https://hyamani.eu/'
theme = 'blowfish'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true # English at /en/, French at /fr/, German at /de/
enableRobotsTXT = true
summaryLength = 0
enableEmoji = true

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  author = 'authors'
  series = 'series'

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# WordPress-style URLs for posts, prefixed by the language code (/fr/, /de/)
[permalinks]
  posts = '/:year/:month/:day/:slug/'

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'categories'
    weight = 100

  [[related.indices]]
    name = 'series'
    weight = 50

  [[related.indices]]
    name = 'authors'
    weight = 20

  [[related.indices]]
    name = 'date'
    weight = 10
