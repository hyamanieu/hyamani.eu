baseURL = 'https://hyamani.eu/'
title = 'H.-Y. "Yanis" AMANIEU'
theme = 'gokarna'# Automatically generate robots.txt
enableRobotsTXT = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true   # English at /, French at /fr/, German at /de/

[markup.goldmark.renderer]
  unsafe = false

[languages]
    # ---------- English ----------
    [languages.en]
    languageName = "English"
    locale = "en"
    weight = 1
    contentDir = "content/en"

    [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about"
        weight = 1
    [[languages.en.menus.main]]
        name = "Posts"
        pageRef = "/posts"
        weight = 2
    [[languages.en.menus.main]]
        name = "Legal notice"
        pageRef = "/legal"
        weight = 3

    # ---------- Français ----------
    [languages.fr]
    languageName = "Français"
    locale = "fr"
    weight = 2
    contentDir = "content/fr"

    [[languages.fr.menus.main]]
        name = "À propos"
        pageRef = "/about"
        weight = 1
    [[languages.fr.menus.main]]
        name = "Articles"
        pageRef = "/posts"
        weight = 2
    [[languages.fr.menus.main]]
        name = "Mentions légales"
        pageRef = "/legal"
        weight = 3

    # ---------- Deutsch ----------
    [languages.de]
    languageName = "Deutsch"
    locale = "de"
    weight = 3
    contentDir = "content/de"

    [[languages.de.menus.main]]
        name = "Über mich"
        pageRef = "/about"
        weight = 1
    [[languages.de.menus.main]]
        name = "Rechtlicher Hinweis"
        pageRef = "/legal"
        weight = 2
[params]
    socialIcons = [{name = "linkedin", url = "https://www.linkedin.com/in/hyamanieu/"}]